openapi: 3.1.0
info:
  title: Velo local API
  version: 1.0.0
  description: |
    Velo local (ADR-017): the same deterministic engine as the web app, as a process on your own
    machine, for your pipelines. It listens only on 127.0.0.1:3301. Every request needs the token
    printed once when `pnpm velo api` starts; a request with a foreign `Host` (DNS rebinding), with
    an `Origin` header (a browser) or from outside loopback is refused before the body is read.
    The key is derived once at startup and never travels in a request. There is no "fast" mode:
    `anonimizar` always measures the exact risk and always returns the certificate.
servers:
  - url: http://127.0.0.1:3301
security:
  - token: []
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: 32 random bytes in hex, new on every start, shown once.
  parameters:
    nombre:
      name: X-Velo-Nombre
      in: header
      required: false
      description: >-
        The file name to write in the certificate (a name, never a path). Its extension decides the
        format: .csv, or .json / .jsonl / .ndjson for JSON. Without it, the body is read as CSV.
      schema: { type: string }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: The error key. Never the raw text of an exception. }
        mensaje: { type: string, description: The explanation, in the language Velo local was started with. }
  responses:
    Rechazo:
      description: 401 without token · 403 outside loopback or with Origin · 421 foreign Host · 413 body over the cap.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
paths:
  /v1/salud:
    get:
      summary: Is it up, and with which key?
      responses:
        "200":
          description: Up. The key fingerprint (12 hex) lets you check it is the key you expect.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  huellaDeLlave: { type: string }
        default: { $ref: "#/components/responses/Rechazo" }
  /v1/diagnosticar:
    post:
      summary: Diagnose a CSV (column categories and the exact risk). Samples come masked.
      parameters: [{ $ref: "#/components/parameters/nombre" }]
      requestBody:
        required: true
        content:
          text/csv: { schema: { type: string, format: binary } }
          application/json: { schema: { type: string, format: binary } }
          application/x-ndjson: { schema: { type: string, format: binary } }
      responses:
        "200": { description: The same report the web app builds (diagnosis, exact risk, advisor). }
        "422": { description: Velo cannot process this file, with its key. }
        default: { $ref: "#/components/responses/Rechazo" }
  /v1/anonimizar:
    post:
      summary: Anonymize a CSV or JSON with a policy. Returns the file, the certificate and the sealed vault.
      parameters:
        - { $ref: "#/components/parameters/nombre" }
        - name: X-Velo-Politica
          in: header
          required: false
          description: habeas-data, hipaa, rgpd, or the local path of a policy exported from the web app. Defaults to the one given at startup.
          schema: { type: string }
      requestBody:
        required: true
        content:
          text/csv: { schema: { type: string, format: binary } }
          application/json: { schema: { type: string, format: binary } }
          application/x-ndjson: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: Anonymized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nombre: { type: string }
                  anonimizado: { type: string, contentEncoding: base64 }
                  sha256DeEntrada: { type: string }
                  sha256DeSalida: { type: string }
                  hashDePolitica: { type: string }
                  filas: { type: integer }
                  riesgo:
                    type: object
                    properties:
                      unicosAntes: { type: number, description: Exact share of unique rows before. }
                      unicosDespues: { type: number, description: Exact share of unique rows after. }
                  certificado: { type: string, description: The certificate, as HTML, with both fingerprints. }
                  boveda: { type: ["string", "null"], contentEncoding: base64, description: The sealed .velo vault, or null if no column is reversible. }
        "422": { description: Velo cannot process this file or policy, with its key. }
        default: { $ref: "#/components/responses/Rechazo" }
  /v1/restaurar:
    post:
      summary: Restore the original values of a returned CSV or JSON with its vault.
      parameters:
        - { $ref: "#/components/parameters/nombre" }
        - name: X-Velo-Boveda
          in: header
          required: true
          description: Local path of the .velo vault, opened with the vault passphrase given at startup.
          schema: { type: string }
      requestBody:
        required: true
        content:
          text/csv: { schema: { type: string, format: binary } }
          application/json: { schema: { type: string, format: binary } }
          application/x-ndjson: { schema: { type: string, format: binary } }
      responses:
        "200": { description: Restored file (base64), its fingerprint and the restoration totals. }
        "422": { description: The vault could not be opened, with its key. }
        default: { $ref: "#/components/responses/Rechazo" }
