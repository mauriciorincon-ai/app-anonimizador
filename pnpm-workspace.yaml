allowBuilds:
  sharp: true
  unrs-resolver: true
  '@swc/core': true
  esbuild: true
  '@tailwindcss/oxide': true
  '@sentry/cli': false
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - '@swc/core'
  - esbuild
  - '@tailwindcss/oxide'
ignoredBuiltDependencies:
  - '@sentry/cli'
overrides:
  '@sentry/bundler-plugins>glob': ^14.0.2
  '@typescript-eslint/typescript-estree>minimatch': ^11.0.1
