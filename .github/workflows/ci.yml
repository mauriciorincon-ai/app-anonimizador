# CI del kit-app — corre en cada PR y en push a main.
# Gates: anti-IA, typecheck, lint, tests+cobertura, build, audit de deps, e2e, Lighthouse vs perf-budget.json
name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Gate propio de Velo (S1): la regla dura "cero IA generativa" como check mecánico.
  # Deliberadamente SIN `needs` y sin `pnpm install`: es el check más barato del pipeline
  # (~10 s, solo lee package.json y el lockfile) y debe ponerse rojo de inmediato, no al final.
  anti-ia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Cero SDKs de IA generativa en el runtime (decisions/001-cero-ia.md)
        run: node scripts/gate-anti-ia.mjs

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # SIN `version`: la lee de "packageManager" del package.json (fuente unica, kit v1.10.2)
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Regla 18 — ningún paquete por debajo de main (kit v1.32.0)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          node scripts/verificar-dependencias.mjs origin/main
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test            # vitest run --coverage (umbral 70% en vitest.config)
      - run: pnpm build
      - run: pnpm audit --audit-level high
      # Regla 17 (cero enlaces, kit v2.0.0): la producción se MUESTRA, jamás se ENTREGA. Dos superficies:
      # los archivos versionados (git grep) y el campo `homepage` del repo (la GitHub App de Vercel lo
      # reescribe tras cada deploy de producción). Los dominios salen de cero-enlaces.json.
      - name: Cero enlaces — árbol y homepage del repo (regla 17, kit v2.0.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOMEPAGE="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.homepage // ""')"
          node scripts/cero-enlaces.mjs --homepage "$HOMEPAGE"

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # SIN `version`: la lee de "packageManager" del package.json (fuente unica, kit v1.10.2)
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e        # incluye scans axe (@axe-core/playwright)

  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # SIN `version`: la lee de "packageManager" del package.json (fuente unica, kit v1.10.2)
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lighthouse CI — budgets (perf-budget.json) + categorias >=90 (kit v1.12.0)
        # Cada sprint añade sus rutas nuevas a lighthouse-urls.json (default: ["/"]).
        # Nota Lantern: el LCP SIMULADO sobre localhost castiga SPAs sanas (nutri-kids S1:
        # 3.8s simulado vs 242ms observado) — budgets client-side necesitan margen documentado.
        # DOS asserts sobre UNA sola coleccion: LHCI declara `budgetsFile` mutuamente excluyente
        # con `assertions` — y la casilla ">=90 en las 4 categorias" del /deploy-check no la
        # medía nadie hasta v1.12.0 (el budget mide tiempos y pesos, que es otra cosa).
        # Ojo al flag: `lhci collect` usa --url=, no --collect.url= (que es de `autorun`).
        run: |
          npm i -g @lhci/cli
          URLS=$(node -e "console.log(require('./lighthouse-urls.json').map(u=>'--url=http://127.0.0.1:3300'+u).join(' '))")
          lhci collect --startServerCommand="pnpm start" $URLS
          lhci assert --budgetsFile=./perf-budget.json
          lhci assert --config=./lighthouse-categorias.json

  # S9 (ADR-017): el puente de Velo local contra los motores de verdad, en contenedor (imágenes
  # públicas y gratuitas; SQL Server 2022 Developer). Es la ÚNICA evidencia de SQL Server de Velo: no
  # se instala en el Mac del usuario. Entra al ruleset `main-protegida` en el mismo sprint (regla 6).
  # Sin secretos: PostgreSQL entra por `trust` (solo escucha en el runner) y la clave de `sa` se arma
  # con el id de la corrida, así que no hay ningún literal en el repo.
  puente:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Velo${{ github.run_id }}aA
        ports: ["1433:1433"]
    env:
      CI: "true"
      VELO_PUENTE_PG: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
      VELO_PUENTE_MSSQL: mssql://sa:Velo${{ github.run_id }}aA@127.0.0.1:1433/master?trustServerCertificate=true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # SIN `version`: la lee de "packageManager" del package.json
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # La prueba espera a SQL Server hasta 2 minutos (tarda en aceptar conexiones) y FALLA si falta
      # una de las dos bases: un `skipped` no es un verde (regla 15).
      - name: El puente contra PostgreSQL 17 y SQL Server 2022
        run: pnpm test:puente
